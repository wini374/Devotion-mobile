<style>
:root {
    color-scheme: dark;
    --violet: #ba87d6;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: #000;
    color: #e8e1ed;
    font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    overflow: hidden;
}
    
/* 權限完成後的歡迎訊息 */

#transfer-complete-message {
    opacity: 0;
    margin-top: 25px;
    text-align: center;

    color: #e0b9f2;
    letter-spacing: 2px;
    line-height: 2;

    transition: opacity 1.4s ease-in-out;
}

#transfer-complete-message.visible {
    opacity: 1;
}


/* ========================================
   Phase 1 → Phase 2：暗紫背景淡入
======================================== */

#ambience {
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;

    background:
        radial-gradient(
            ellipse at 50% 65%,
            rgba(88, 25, 115, .23),
            transparent 55%
        ),
        radial-gradient(
            ellipse at 15% 20%,
            rgba(52, 12, 87, .2),
            transparent 45%
        ),
        #020103;

    transition:
        opacity 5s ease,
        visibility 0s linear 5s;

    animation:
        ambienceDrift 18s ease-in-out infinite alternate;
}

body.phase-2 #ambience,
body.phase-3 #ambience {
    opacity: 1;
    visibility: visible;

    transition:
        opacity 5s ease,
        visibility 0s;
}

/* Phase 3：背景恢復穩定 */

body.phase-3 #ambience {
    background:
        radial-gradient(
            ellipse at 50% 78%,
            rgba(94, 33, 123, .24),
            transparent 48%
        ),
        #030105;

    animation: none;
    transition: opacity 3s ease;
}

@keyframes ambienceDrift {
    from {
        transform: translate(-2%, -1%) scale(1);
    }

    to {
        transform: translate(2%, 2%) scale(1.04);
    }
}

/* ========================================
   Phase 3：王座紫色光芒
======================================== */

#throne-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0;

    background:
        radial-gradient(
            ellipse at 50% 86%,
            rgba(162, 72, 202, .24),
            transparent 46%
        );

    transition: opacity 5s ease;
}

body.phase-3 #throne-glow {
    opacity: 1;
}

/* ========================================
   敘事舞台
======================================== */

#screen {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 5;
}

#story {
    position: relative;
    width: min(90vw, 860px);
    height: 45vh;

    display: grid;
    place-items: center;
    text-align: center;
}

.line {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
    transition: opacity 1.6s ease;

    font-size: clamp(1rem, 2.2vw, 1.23rem);
    letter-spacing: .14em;
    line-height: 2.2;

    color: #e9e3ef;

    text-shadow:
        0 0 10px rgba(235, 200, 255, .1);
}

/* 重要決心：白色字幕 */

.line.resolve {
    color: #f7f0fb;
    font-weight: 600;
    letter-spacing: .18em;
}

/* 戴上王冠：紫色字幕 */

.line.coronation {
    color: #d5a5ec;

    text-shadow:
        0 0 18px rgba(180, 100, 220, .25);
}

/* ========================================
   系統提示
======================================== */

#system-message {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(90vw, 900px);

    opacity: 0;
    transition: opacity 1.4s ease;

    text-align: center;
    color: #b989d2;

    font:
        clamp(.86rem, 1.8vw, 1.05rem)/2
        'Courier New', monospace;

    letter-spacing: .12em;
    pointer-events: none;
}

/* ========================================
   權限繼承進度畫面
======================================== */

#protocol {
    display: none;
    opacity: 0;

    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(90vw, 540px);
    padding: 26px;

    text-align: left;

    background: rgba(8, 4, 14, .91);

    border:
        1px solid rgba(173, 110, 211, .33);

    box-shadow:
        0 0 35px rgba(86, 21, 122, .15);

    font:
        clamp(.78rem, 1.7vw, .96rem)/2
        'Courier New', monospace;

    color: #c9a3dc;

    transition: opacity 3s ease;
}
.protocol-title {
    font-weight: bold;
    color: #ead3f5;
    letter-spacing: .08em;
    margin-bottom: 12px;
}

.protocol-track {
    height: 5px;
    background: #26152e;
    margin: 15px 0;
    border-radius: 99px;
    overflow: hidden;
}

#protocol-progress {
    height: 100%;
    width: 0%;

    background: #be79de;

    transition: width 2.7s ease;
}

/* ========================================
   靈魂抹除：短暫黑屏
======================================== */

#purge-screen {
    position: fixed;
    inset: 0;
    z-index: 8;

    background: #000;

    opacity: 0;
    pointer-events: none;

    transition: opacity 1.5s ease;
}

/* ========================================
   最終結局畫面
======================================== */

#ending-stage {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(90vw, 800px);

    text-align: center;

    display: none;
    opacity: 0;

    transition: opacity 3s ease;
}

.epitaph {

.title {

    color: #f4eff6;

}

.sub {

}

.tagline {
    font: .85rem 'Courier New', monospace;
    letter-spacing: .1em;

}

/* ========================================
   初始化新紀元按鈕

   結局顯示後等待 5 秒，
   再使用 4 秒淡入。
======================================== */

#logout-btn {
    display: inline-block;

    border: 1px dashed #8e5ba8;

    color: #b891cb;

    padding: 11px 28px;
    letter-spacing: .16em;

    text-decoration: none;

    opacity: 0;
    pointer-events: none;

        opacity 4s ease-in-out,

#logout-btn.visible {

}

#logout-btn:hover,
#logout-btn:focus-visible {
    background: rgba(148, 75, 184, .15);
    color: #fff;

    box-shadow:
        0 0 14px rgba(161, 87, 200, .2);
}

/* ========================================
   降低動態效果
======================================== */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition-duration: .01ms !important;
    }
}

<script>
/* ========================================
   DEVOTION — ENDING C
   INHERITANCE
   完整修正版
======================================== */

/* ========================================
   劇情字幕
======================================== */

const narrativeLines = [
    {
        text: '你沒有按下自毀程序',
        phase: 1
    },
    {
        text: '你終於明白了，為什麼他寧願背負所有人的仇恨<br>也不願將這個世界交還給它原本的模樣',
        phase: 1
    },
    {
        text: '失去了共同的敵人，曾經並肩作戰的陣營終將再次分裂<br>猜忌會重新滋長，貪婪會再次點燃戰火<br>而那些用無數生命換來的和平，也將隨之化為灰燼',
        phase: 2
    },
    {
        text: '你不能讓他的犧牲，成為第三十七次輪迴的開端',
        phase: 2,
        kind: 'resolve'
    },
    {
        text: '於是，在核心徹底崩毀之前<br>你伸手接過了那份他曾獨自背負的權限',
        phase: 2
    },
    {
        text: '你將他殘存的靈魂碎片逐一抹除<br>讓那些被三十六次輪迴囚禁的記憶，終於歸於寂靜',
        phase: 2,
        event: 'purge'
    },
    {
        text: '這是你最後一次替他做出選擇<br>也是他第一次，不必再為這個世界承受苦難',
        phase: 2
    },
    {
        text: '然後，你拾起了那頂沾滿鮮血的王冠',
        phase: 3,
        kind: 'coronation',
        event: 'crown'
    },
    {
        text: '它比你想像的更加沉重<br>彷彿三十六次輪迴裡所有未曾說出口的遺憾，<br>都在這一刻落到了你的肩上',
        phase: 3
    },
    {
        text: '王座之外，天空依舊灰暗<br>反抗軍驚恐地發現，舊的暴君雖已殞落<br>但那個掌控世界的神明，從未真正消失',
        phase: 3
    },
    {
        text: '只是這一次，坐在王座上的人，換成了你',
        phase: 3
    },
    {
        text: '「我會替你把這場戲演完的」',
        phase: 3,
        kind: 'resolve'
    },
    {
        text: '「...我的摯友」',
        phase: 3,
        kind: 'resolve'
    }
];

/* ========================================
   基礎工具
======================================== */

const sleep = ms => new Promise(
    resolve => setTimeout(resolve, ms)
);

const reducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
).matches;

function fadeInElement(element) {
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            element.style.opacity = '1';
        });
    });
}

/* ========================================
   C.mp3 音樂
======================================== */

let audioFadeToken = 0;

async function fadeInAudio(
    audio,
    target = 0.55,
    duration = 5000
) {
    if (!audio) return;

    const token = ++audioFadeToken;

    audio.volume = 0;

    try {
        await audio.play();
    } catch (error) {
        console.warn(
            '音樂無法自動播放：',
            error
        );
        return;
    }

    const steps = 25;

    for (let i = 1; i <= steps; i++) {
        if (token !== audioFadeToken) return;

        audio.volume = Math.min(
            1,
            target * i / steps
        );

        await sleep(duration / steps);
    }
}

async function fadeOutAudio(
    audio,
    duration = 1800
) {
    ++audioFadeToken;

    if (!audio || audio.paused) return;

    const initialVolume = audio.volume;
    const steps = 20;

    for (let i = 1; i <= steps; i++) {
        audio.volume = Math.max(
            0,
            initialVolume * (1 - i / steps)
        );

        await sleep(duration / steps);
    }

    audio.pause();
}

/* ========================================
   Phase 切換
======================================== */

function setPhase(phase) {
    document.body.classList.remove(
        'phase-1',
        'phase-2',
        'phase-3'
    );

    document.body.classList.add(
        'phase-' + phase
    );
}

/* ========================================
   系統訊息
======================================== */

async function showSystemMessage(
    message,
    duration = 2600
) {
    const element = document.getElementById(
        'system-message'
    );

    element.textContent = message;

    element.style.opacity = '1';

    await sleep(duration);

    element.style.opacity = '0';

    await sleep(
        reducedMotion ? 80 : 1450
    );
}

/* ========================================
   劇情字幕播放
======================================== */

async function showNarrativeLine(line) {
    setPhase(line.phase);

    const host = document.getElementById(
        'story'
    );

    const element = document.createElement('div');

    element.className =
        'line' +
        (line.kind ? ' ' + line.kind : '');

    element.innerHTML = line.text;

    host.appendChild(element);

    /* 新王登基黑屏 */
    if (line.event === 'crown') {
        const cover = document.getElementById(
            'purge-screen'
        );

        cover.style.opacity = '1';

        await sleep(1350);

        cover.style.opacity = '0';

        await sleep(1600);
    }

    /* 字幕淡入 */
    fadeInElement(element);

    const plainText = line.text.replace(
        /<br\s*\/?\s*>/gi,
        ''
    );

    const duration =
        Math.max(
            3200,
            2300 + plainText.length * 75
        ) +
        (line.kind === 'resolve' ? 1500 : 0);

    await sleep(duration);

    /* 字幕淡出 */
    element.style.opacity = '0';

    await sleep(
        reducedMotion ? 100 : 1650
    );

    element.remove();

    /* 靈魂抹除協定 */
    if (line.event === 'purge') {
        await showPurgeProtocol();
    }
}

/* ========================================
   靈魂抹除
   權限暫停於 36%
======================================== */

async function showPurgeProtocol() {
    const protocol = document.getElementById(
        'protocol'
    );

    const bar = document.getElementById(
        'protocol-progress'
    );

    const status = document.getElementById(
        'protocol-status'
    );

    const message = document.getElementById(
        'transfer-complete-message'
    );

    message.classList.remove('visible');

    bar.style.width = '36%';

    status.textContent =
        '> AUTHORITY TRANSFER: 36%';

    protocol.style.display = 'block';

    fadeInElement(protocol);

    await sleep(1000);

    await sleep(1800);

    status.textContent =
        '> AUTHORITY TRANSFER: PENDING';

    await sleep(2000);

    protocol.style.opacity = '0';

    await sleep(1100);

    protocol.style.display = 'none';
}

/* ========================================
   最終權限轉移

   36% → 100%
   100% 後延遲 2.5 秒顯示歡迎訊息
======================================== */

async function finalizeProtocol() {
    const protocol = document.getElementById(
        'protocol'
    );

    const bar = document.getElementById(
        'protocol-progress'
    );

    const status = document.getElementById(
        'protocol-status'
    );

    const message = document.getElementById(
        'transfer-complete-message'
    );

    /* 重設 */
    message.classList.remove('visible');

    bar.style.transition = 'none';
    bar.style.width = '36%';

    status.textContent =
        '> AUTHORITY TRANSFER: 36%';

    protocol.style.opacity = '0';
    protocol.style.display = 'block';

    /* 先確定進度條從 36% 開始 */
    await sleep(100);

    fadeInElement(protocol);

    await sleep(1200);

    /* 進度條與數字同步從 36% 增長到 100% */
    const startValue = 36;
    const endValue = 100;
    const duration = 2700;
    const startTime = performance.now();

    bar.style.transition = 'none';

    await new Promise(resolve => {
        function updateProgress(now) {
            const elapsed = Math.min((now - startTime) / duration, 1);
            // 使用 ease-out，讓結尾稍微放慢
            const eased = 1 - Math.pow(1 - elapsed, 3);
            const value = Math.min(endValue,
                Math.floor(startValue + (endValue - startValue) * eased));

            bar.style.width = value + '%';
            status.textContent = '> AUTHORITY TRANSFER: ' + value + '%';

            if (elapsed < 1) {
                requestAnimationFrame(updateProgress);
            } else {
                bar.style.width = '100%';
                status.textContent = '> AUTHORITY TRANSFER: 100%';
                resolve();
            }
        }
        requestAnimationFrame(updateProgress);
    });

    /* 進度條已達 100%，再等待 2.5 秒才出現訊息 */
    await sleep(2500);
    message.classList.add('visible');

    /* 訊息淡入並停留 */
    await sleep(3500);

    /* 淡出 */
    message.classList.remove('visible');

    protocol.style.opacity = '0';

    await sleep(1500);

    protocol.style.display = 'none';
}

/* ========================================
   主播放流程
======================================== */

async function play() {
    const audio = document.getElementById(
        'end-bgm'
    );

    /* 嘗試播放 C.mp3 */
    void fadeInAudio(audio);

    await sleep(1200);

    /* 開場系統訊息 */
    await showSystemMessage(
        '> [ 權限轉移中... ]',
        2900
    );

    /* Phase 1 → Phase 2 → Phase 3 */
    for (const line of narrativeLines) {
        await showNarrativeLine(line);
    }

    /* 最後一句字幕結束後，等待音樂節奏 */
    await sleep(2500);

    /* 重新顯示紫色權限轉移框：36% → 100% → 延遲歡迎訊息 */
    await finalizeProtocol();

    /* 進入結局畫面 */
    await sleep(1000);

    const ending = document.getElementById(
        'ending-stage'
    );

    ending.style.display = 'block';

    fadeInElement(ending);

    /* 延遲 5 秒後讓 LOGOUT 淡入 */
    await sleep(5000);

    document.getElementById(
        'logout-btn'
    ).classList.add('visible');
}

/* ========================================
   LOGOUT
======================================== */

let leaving = false;

document.getElementById(
    'logout-btn'
).addEventListener('click', async event => {
    event.preventDefault();

    if (leaving) return;

    leaving = true;

    const button = document.getElementById(
        'logout-btn'
    );

    button.style.pointerEvents = 'none';

    const ending = document.getElementById(
        'ending-stage'
    );

    ending.style.transition = 'opacity 1.8s ease';
    ending.style.opacity = '0';

    await Promise.all([
        fadeOutAudio(
            document.getElementById('end-bgm')
        ),
        sleep(1800)
    ]);

    window.location.href = 'index.html';
});

/* ========================================
   啟動劇情
======================================== */

window.addEventListener('load', () => {
    play().catch(error => {
        console.error(
            'ENDING C 播放失敗：',
            error
        );
    });
});

</script>
