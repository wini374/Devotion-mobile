<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ADMIN_ROOT_LOG</title>
    <script>
        // 進站前標記返回模式：先隱藏日誌，完成定位後再淡入。
        if (new URLSearchParams(location.search).get("resume") === "choice") {
            document.documentElement.classList.add("choice-returning");
        }
    </script>
    <style>
        /* ================= 基礎終端機樣式 ================= */
        body {
            background-color: #030303;
            color: #dddddd;
            font-family: "Courier New", Courier, monospace;
            padding: 2rem;
            line-height: 1.8;
            overflow-x: hidden;
            margin: 0;
        }

        ::selection { background-color: #ffaa00; color: #000000; }
        
        #terminal-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background-color: rgba(10, 10, 10, 0.8);
            border: 1px solid #ffaa00;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.1);
            padding-bottom: 60px;
        }

        /* 片尾返回：日誌及所有結局選項同步淡入，避免先閃現。 */
        html.choice-returning #terminal-container,
        html.choice-returning #action-section,
        html.choice-returning #hidden-c {
            opacity: 0;
            transition: opacity 1.8s ease-in-out;
        }
        html.choice-returning.choice-visible #terminal-container,
        html.choice-returning.choice-visible #action-section,
        html.choice-returning.choice-visible #hidden-c {
            opacity: 1;
        }

        /* 文字層級與顏色 */
        .sys-auth { color: #ffaa00; margin-bottom: 25px; border-left: 3px solid #ffaa00; padding-left: 15px; font-weight: bold; }
        .sys-msg { color: #cccccc; margin-bottom: 15px; }
        .sys-alert { color: #ff3333; margin-top: 30px; margin-bottom: 15px; font-weight: bold; text-shadow: 0 0 3px red; }
        .memory-log { color: #aaffaa; margin-bottom: 15px; font-style: italic; border-left: 2px solid #aaffaa; padding-left: 15px; }
        .truth-log { color: #ffaa00; margin-bottom: 15px; border-left: 2px solid #ffaa00; padding-left: 15px; }
        .final-words { color: #ffffff; margin-top: 40px; margin-bottom: 15px; text-shadow: 0 0 8px #ffffff; font-size: 1.2rem; font-weight: bold; text-align: center; }

        /* 打字機游標 */
        .cursor {
            display: inline-block;
            width: 10px; height: 1.2rem;
            background-color: currentColor;
            animation: blink 1s infinite;
            vertical-align: bottom;
            margin-left: 4px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* A、B 按鈕樣式 (橘框外) */
        .btn {
            background-color: transparent;
            padding: 10px 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.5s ease;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* 結局 D 按鈕 (橘框內) */
        .backup-btn {
            display: block; /* 確保它自己佔一行 */
            margin-top: 40px;
            text-align: right;
            color: #006655;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            opacity: 0; /* 預設隱藏，靠 JS 加上 animation class */
        }
        .backup-btn span {
            border-bottom: 1px dashed #006655;
            padding-bottom: 2px;
        }
        .backup-btn:hover span {
            color: #000;
            background-color: #006655;
            box-shadow: 0 0 15px rgba(0,204,170,0.6);
        }
        
        .fade-in-anim {
            animation: fadeIn 2s forwards;
        }
        @keyframes fadeIn { to { opacity: 1; } }

        /* 結局 C 按鈕 (隱藏在畫面右下角) */
        #hidden-c {
            position: fixed;
            bottom: 5px;
            right: 10px;
            color: #050505; /* 與背景相近，要反白才看得到 */
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            z-index: 100;
        }
    </style>
    <!-- Mobile edition: responsive layout and touch/audio compatibility -->
    <link rel="stylesheet" href="mobile.css">
    <script src="mobile-compat.js"></script>
</head>
<body>

    <!-- BGM -->
    <audio id="sad-bgm" src="日誌bgm.mp3" loop></audio>

    <div id="terminal-container">
        <!-- 腳本會自動將終端機文字打在這裡 -->
    </div>

    <!-- 結局 A、B 按鈕區 (橘框外) -->
    <div id="action-section" style="max-width: 800px; margin: 0 auto; margin-top: 30px; margin-bottom: 50px; display: none; justify-content: flex-end; gap: 20px;">
        <!-- 結局 B 按鈕 (殉情/叛逆) -->
        <a onclick="fadeOutAndNavigate('end_B.html', 'sad-bgm')" class="btn" style="border: 1px solid #555; color: #888;">> [OVERRIDE] 拒絕。強制上傳自我意識。</a>
        <!-- 結局 A 按鈕 (成全/主線) -->
        <a onclick="fadeOutAndNavigate('end_A.html', 'sad-bgm')" class="btn" style="border: 1px solid #ff3333; color: #ff3333; box-shadow: 0 0 10px rgba(255, 51, 51, 0.2);">> [EXECUTE] 遵從遺願，啟動自毀程序。</a>
    </div>

    <!-- 結局 C 按鈕 (極度隱蔽) -->
    <a id="hidden-c" onclick="fadeOutAndNavigate('end_C.html', 'sad-bgm')">_ override_admin_privilege</a>

    <script>

        window.onload = function() {
            const bgm = document.getElementById("sad-bgm");
            if(bgm) {
                bgm.volume = 0;
                bgm.play().catch(e => console.log("BGM blocked", e));
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.7) { vol += 0.05; bgm.volume = vol; }
                    else clearInterval(fadeIn);
                }, 200);
            }

            // Returning from any archived ending bypasses typewriter playback.
            if (new URLSearchParams(window.location.search).get("resume") === "choice") {
                restoreAdminChoice();
            } else {
                playAdminLog();
            }
        };

        async function playAdminLog() {
            const container = document.getElementById("terminal-container");
            
            for (let i = 0; i < adminLines.length; i++) {
                const lineData = adminLines[i];
                const div = document.createElement("div");
                div.className = lineData.class;
                container.appendChild(div);
                
                const cursor = document.createElement("span");
                cursor.className = "cursor";
                if (lineData.class === 'sys-auth' || lineData.class === 'truth-log') {
                    cursor.style.color = '#ffaa00';
                } else if (lineData.class === 'memory-log') {
                    cursor.style.color = '#aaffaa';
                } else if (lineData.class === 'sys-alert' || lineData.class === 'final-words') {
                    cursor.style.color = 'inherit';
                } else {
                    cursor.style.color = '#cccccc';
                }
                
                let currentHTML = "";
                const text = lineData.text;

                for (let j = 0; j < text.length; j++) {
                    if (text.charAt(j) === '\n') {
                        currentHTML += "<br>";
                    } else {
                        currentHTML += text.charAt(j);
                    }
                    div.innerHTML = currentHTML;
                    div.appendChild(cursor);
                    
                    let speed = Math.random() * 40 + 50; 
                    if (['，', '。', '？', '！', '…', '\n'].includes(text.charAt(j))) {
                        speed += 400; 
                    }
                    if (lineData.class === 'final-words') {
                        speed += 120; 
                    }
                    
                    window.scrollTo(0, document.body.scrollHeight);
                    await new Promise(r => setTimeout(r, speed));
                }
                
                cursor.remove();
                
                let pauseTime = 1200;
                if (lineData.class === 'sys-alert') pauseTime = 600;
                if (lineData.class === 'final-words') pauseTime = 2000; 
                await new Promise(r => setTimeout(r, pauseTime)); 
            }
            
            showAdminChoice(true);
        }

        // 供正常日誌播放與結局返回共同使用的結局選項。
        function showAdminChoice(animate = true) {
            const container = document.getElementById("terminal-container");
            if (!container.querySelector(".backup-btn")) {
                const backupBtn = document.createElement("a");
                backupBtn.className = animate ? "backup-btn fade-in-anim" : "backup-btn";
                if (!animate) backupBtn.style.opacity = "1";
                backupBtn.innerHTML = "<span>> [ 偵測到未加密的記憶區塊，是否執行 virtual_backup.sh ？ ]</span>";
                backupBtn.onclick = function() { fadeOutAndNavigate('end_D.html', 'sad-bgm'); };
                container.appendChild(backupBtn);
            }
            document.getElementById("action-section").style.display = "flex";
            window.scrollTo(0, document.body.scrollHeight);
        }

        // 封存結局返回時：直接恢復日誌全文與抉擇，不播放逐字動畫。
        function restoreAdminChoice() {
            const container = document.getElementById("terminal-container");
            container.innerHTML = "";
            const fragment = document.createDocumentFragment();
            for (const lineData of adminLines) {
                const div = document.createElement("div");
                div.className = lineData.class;
                div.textContent = lineData.text;
                div.style.whiteSpace = "pre-line";
                fragment.appendChild(div);
            }
            container.appendChild(fragment);
            showAdminChoice(false);
            window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "instant" });
            requestAnimationFrame(() => {
                window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "instant" });
                requestAnimationFrame(() => {
                    document.documentElement.classList.add("choice-visible");
                });
            });
        }

        function fadeOutAndNavigate(targetUrl, bgmId) {
            const container = document.getElementById("terminal-container");
            const btn = document.getElementById("action-section");
            const hiddenBtn = document.getElementById("hidden-c");
            const bgm = document.getElementById(bgmId);
            
            // 淡出所有畫面元素
            if(container) { container.style.transition = "opacity 2s ease"; container.style.opacity = 0; }
            if(btn) { btn.style.transition = "opacity 2s ease"; btn.style.opacity = 0; }
            if(hiddenBtn) { hiddenBtn.style.opacity = 0; }

            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = Math.max(0, vol); 
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; 
                    }
                }, 150); 
            } else {
                setTimeout(() => { window.location.href = targetUrl; }, 2000);
            }
        }
    </script>
