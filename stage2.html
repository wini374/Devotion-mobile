<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GHOST_TRAIL_LOGS</title>
    <style>
        /* ================= 基礎終端機樣式 ================= */
        body {
            background-color: #050505;
            color: #00cc00;
            font-family: "Courier New", Courier, monospace;
            padding: 2rem;
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
        }

        ::selection { background-color: #ffffff; color: #000000; }
        
        #terminal-container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        /* 文字層級與顏色 */
        .sys-msg { color: #00cc00; margin-bottom: 15px; }
        .log-data { color: #88dd88; margin-bottom: 15px; border-left: 2px solid #004400; padding-left: 15px; }
        .sys-alert { color: #ffaa00; margin-bottom: 15px; font-weight: bold; }
        .fatal-error { color: #ff3333; margin-bottom: 15px; text-shadow: 0 0 5px red; font-weight: bold; }
        .admin-override { color: #ffffff; margin-bottom: 15px; font-style: italic; text-shadow: 0 0 3px #ffffff; }

        /* 打字機游標 */
        .cursor {
            display: inline-block;
            width: 10px; height: 1.2rem;
            background-color: currentColor;
            animation: blink 1s infinite;
            vertical-align: bottom;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        /* 畫面強烈震動特效 */
        .screen-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); filter: drop-shadow(2px 0 red); }
            20%, 80% { transform: translate3d(6px, 0, 0); filter: drop-shadow(-2px 0 blue); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); filter: drop-shadow(4px 0 magenta); }
            40%, 60% { transform: translate3d(8px, 0, 0); filter: drop-shadow(-4px 0 cyan); }
        }

        /* 閃爍文字特效 (時間加長，停留更久) */
        .flash-text {
            animation: flash-anim 3s forwards;
            opacity: 0;
        }
        @keyframes flash-anim {
            0% { opacity: 0; filter: blur(2px); }
            10% { opacity: 1; filter: blur(0); }
            85% { opacity: 1; filter: blur(0); }
            100% { opacity: 0; filter: blur(5px); }
        }

        /* ================= 彈窗與按鈕樣式 ================= */
        .btn {
            background-color: transparent;
            border: 1px solid #00cc00;
            color: #00cc00;
            padding: 8px 20px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn:hover { background-color: #00cc00; color: #000; }

        /* 密碼彈窗背景 */
        #password-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        /* 密碼彈窗本體 */
        .modal-content {
            background-color: #050505;
            border: 1px solid #ffaa00;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
        }

        #puzzle-input {
            background-color: #000;
            color: #00cc00;
            border: 1px solid #00cc00;
            padding: 10px 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            outline: none;
            width: 300px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }
        #puzzle-input:focus { box-shadow: 0 0 8px rgba(0, 204, 0, 0.5); }
    </style>
    <!-- Mobile edition: responsive layout and touch/audio compatibility -->
    <link rel="stylesheet" href="mobile.css">
    <script src="mobile-compat.js"></script>
</head>
<body>

    <!-- 音樂設定 -->
    <audio id="terminal-bgm" src="盲文.mp3" loop></audio>

    <div id="terminal-container">
        <!-- 腳本會自動將終端機文字打在這裡 -->
    </div>

    <!-- 底部按鈕區 (對齊方式改為靠左 text-align: left) -->
    <div id="action-section" style="display: none; text-align: left; max-width: 900px; margin: 0 auto; margin-top: 30px;">
        <button class="btn" onclick="openModal()">> 管理員日誌</button>
    </div>

    <!-- 密碼驗證彈窗 -->
    <div id="password-modal">
        <div class="modal-content">
            <div style="color: #ffaa00; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px;">[ 存取權限驗證 ]</div>
            <input type="text" id="puzzle-input" placeholder="請輸入密碼">
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button class="btn" style="border-color: #ffaa00; color: #ffaa00;" onclick="verifyPassword()">> 執行</button>
                <button class="btn" onclick="closeModal()">> 取消</button>
            </div>
            <div id="error-msg" style="color: #ff3333; margin-top: 15px; display: none; font-weight: bold;">[ 驗證失敗：密鑰不符 ]</div>
        </div>
    </div>

    <script>
        // --- 劇情腳本設定 ---
        
const scriptLines = [

    // PHASE 1：追蹤資產來源

    {
        class: 'sys-msg',
        text: "> 正在存取管理員資產日誌 (GHOST_TRAIL_LOGS)..."
    },
    {
        class: 'sys-msg',
        text: "> 權限已覆寫。正在載入 資產_01、資產_02、資產_03 的底層資料..."
    },
    {
        class: 'sys-msg',
        instant: true,
        text: "=================================================="
    },
    {
        class: 'log-data',
        text: "[ 靈魂實體交叉比對 // 第36週期 ]\n" +
              "> 資產_01：阿斯蘭朵區域 [ TERMINATED ]\n" +
              "> 資產_02：新星聯邦 [ TERMINATED ]\n" +
              "> 資產_03：灰燼之地 [ TERMINATED ]"
    },
    {
        class: 'sys-alert',
        instant: true,
        text: "> [ 異常報告 ]：三名資產具有獨立意識與記憶紀錄。\n" +
              "> [ 警告 ]：所有實體的靈魂特徵碼完全一致。\n" +
              "> 正在追蹤底層意識來源..."
    },
    {
        class: 'log-data',
        text: "資產_01 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]\n" +
              "資產_02 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]\n" +
              "資產_03 來源 IP: 127.0.0.1 [ LOCAL_HOST_ADMIN ]"
    },

    // PHASE 2：靈魂切片真相

    {
        class: 'sys-msg',
        instant: true,
        text: "--------------------------------------------------"
    },
    {
        class: 'sys-alert',
        text: "> [ 系統異常 ]：來源資料並非一般監視程式。\n" +
              "> 偵測到獨立人格與完整感官紀錄。"
    },
    {
        class: 'log-data',
        text: "> 資產類型：SOUL_FRAGMENT\n" +
              "> 靈魂來源：ADMINISTRATOR\n" +
              "> 傳輸模式：CONDITIONAL_SYNC\n" +
              "> 同步條件：主動訊號 / 生命終止"
    },
    {
        class: 'sys-alert',
        instant: true,
        text: "> [ 警告 ]：資產終止後，靈魂結構無法復原。\n" +
              "> 已消耗的靈魂切片無法重新分配。"
    },
    {
        class: 'sys-msg',
        text: "> 正在重建管理員本體靈魂狀態..."
    },
    {
        class: 'sys-alert',
        instant: true,
        text: "> [ 異常 ]：靈魂完整性低於安全閾值。\n" +
              "> 偵測到大量不可逆的靈魂損耗。"
    },

    // PHASE 3：隱藏密鑰

    {
        class: 'sys-msg',
        instant: true,
        text: "--------------------------------------------------"
    },
    {
        class: 'sys-msg',
        text: "> 偵測到未完成的管理員底層指令。\n" +
              "> 指令已加密。正在還原殘存密鑰..."
    },
    {
        class: 'sys-alert',
        instant: true,
        text: "> [ 加密偏移量 ]: -3"
    },
    {
        class: 'sys-msg',
        text: "⠏⠃&nbsp;&nbsp;&nbsp;⠵⠇⠧⠅",
        style: "font-size: 2.5rem; letter-spacing: 8px; margin: 20px 0;"
    },

    // PHASE 4：回溯失敗

    {
        class: 'sys-msg',
        instant: true,
        text: "--------------------------------------------------"
    },
    {
        class: 'sys-msg',
        text: "> 正在讀取最後一次回溯紀錄..."
    },
    {
        class: 'sys-msg',
        text: "> [ 系統狀態 ]：世界穩定性持續下降。\n" +
              "> 最終回溯程序已被請求。"
    },
    {
        class: 'sys-msg',
        text: "> EXECUTE: TIME_REVERT(-3_YEARS)"
    },
    {
        class: 'sys-msg',
        text: "> 正在驗證因果律回溯協定...\n" +
              "> 時間錨點確認... 10%\n" +
              "> 記憶同步檢查... 45%\n" +
              "> 靈魂完整性驗證... 89%"
    },
    {
        class: 'fatal-error',
        instant: true,
        text: "> [ 錯誤 ]：靈魂完整性不足！回溯程序遭到強制中止。"
    },
    {
        class: 'sys-alert',
        instant: true,
        text: "> [ FATAL ERROR: SOUL_INTEGRITY_BELOW_THRESHOLD ]\n" +
              "> [ 系統判定 ]：管理員已無法支撐下一次時間回溯。"
    },
    {
        class: 'fatal-error',
        instant: true,
        text: "> [ 警告 ]：第37週期無法建立。\n" +
              "> 回溯權限仍然有效，但執行條件已永久喪失。"
    },

    // PHASE 5：管理員無意間留下的心聲

    {
        class: 'admin-override',
        flash: true,
        text: "「......不可能。」"
    },
    {
        class: 'admin-override',
        flash: true,
        text: "「再試一次......只要再一次就好......」"
    },
     {
        class: 'admin-override',
        flash: true,
        text: "「已經三十六次了……為什麼……還是沒能改變結局？」"
    },
    {
        class: 'admin-override',
        flash: true,
        text: "「我明明......已經犧牲了那麼多......」"
    },
    {
        class: 'admin-override',
        flash: true,
        text: "「......我真的已經盡力了。」"
    },
    {
        class: 'admin-override',
        flash: true,
        text: "「到頭來......我還是什麼都沒能改變。」"
    },
    {
        class: 'admin-override',
        flash: true,
        text: "「......已經沒有下一次了嗎？」"
    }

];

        window.onload = function() {
            const bgm = document.getElementById("terminal-bgm");
            bgm.volume = 0;
            bgm.play().catch(e => console.log("BGM blocked", e));
            
let vol = 0;

const fadeIn = setInterval(() => {
    if (vol < 0.6) {
        vol = Math.min(0.6, vol + 0.05);
        bgm.volume = vol;
    } else {
        clearInterval(fadeIn);
    }
}, 200);

            // 啟動終端機敘事，否則只有音樂、沒有文字
            playScript();
        };

        async function playScript() {
            const container = document.getElementById("terminal-container");
            let isFirstFlash = true; // 用來標記是否為第一句心聲
            
            for (let i = 0; i < scriptLines.length; i++) {
                const lineData = scriptLines[i];
                const div = document.createElement("div");
                div.className = lineData.class;
                if (lineData.style) div.style.cssText = lineData.style;
                container.appendChild(div);
                
                const text = lineData.text;

                // 處理震動 (移除切換音樂)
              
                if (
                    lineData.class === 'fatal-error' &&
                    text.includes("靈魂完整性不足")
                ) {
                    document.body.classList.remove("screen-shake");
                
                    void document.body.offsetWidth;
                
                    document.body.classList.add("screen-shake");
                
                    setTimeout(() => {
                        document.body.classList.remove("screen-shake");
                    }, 600);
                }


                // 判斷是否為「瞬間顯示」
                if (lineData.instant) {
                    div.innerHTML = text.replace(/\n/g, "<br>");
                    window.scrollTo(0, document.body.scrollHeight);
                    await new Promise(r => setTimeout(r, 400));
                } 
                // 判斷是否為「一閃而過」
                else if (lineData.flash) {
                    // 如果是第一句心聲，強制等待 3 秒鐘 (3000ms) 讓氣氛沉澱
                    if (isFirstFlash) {
                        await new Promise(r => setTimeout(r, 3000));
                        isFirstFlash = false;
                    }
                    
                    div.classList.add("flash-text"); 
                    div.innerHTML = text;
                    window.scrollTo(0, document.body.scrollHeight);
                    
                    // 停留時間從 1.2 秒延長至 3.5 秒 (3500ms)
                    await new Promise(r => setTimeout(r, 3500)); 
                    div.style.display = "none"; 
                } 
                // 一般打字機效果
                else {
                    const cursor = document.createElement("span");
                    cursor.className = "cursor";
                    let currentHTML = "";

                    for (let j = 0; j < text.length; j++) {
                        if (text.charAt(j) === '\n') {
                            currentHTML += "<br>";
                        } else {
                            currentHTML += text.charAt(j);
                        }
                        div.innerHTML = currentHTML;
                        div.appendChild(cursor);
                        
                        let speed = 40; 
                        window.scrollTo(0, document.body.scrollHeight);
                        await new Promise(r => setTimeout(r, speed));
                    }
                    cursor.remove();
                    await new Promise(r => setTimeout(r, 400)); 
                }
            }
            
            // 腳本全數結束後，顯示底部的管理員日誌按鈕 (已靠左對齊)
            document.getElementById("action-section").style.display = "block";
            window.scrollTo(0, document.body.scrollHeight);
        }

        // --- 彈窗與驗證邏輯 ---
        function openModal() {
            document.getElementById("password-modal").style.display = "flex";
            document.getElementById("puzzle-input").focus();
        }

        function closeModal() {
            document.getElementById("password-modal").style.display = "none";
            document.getElementById("error-msg").style.display = "none";
            document.getElementById("puzzle-input").value = "";
        }

        function verifyPassword() {
            const inputField = document.getElementById("puzzle-input");
            const errorMsg = document.getElementById("error-msg");
            
            let answer = inputField.value.toLowerCase().replace(/\s+/g, '');
            
            // 點字 J V   T F P E，退 3 格後明文為 M Y   W I S H
            if (answer === "mywish") {
                errorMsg.style.display = "none";
                fadeOutAndNavigate("admin.html", "terminal-bgm"); // 音樂漸弱並跳轉
            } else {
                errorMsg.style.display = "block";
                inputField.value = "";
                inputField.focus();
            }
        }

        document.getElementById("puzzle-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyPassword();
            }
        });

        // --- 音樂淡出並跳轉頁面 ---
        function fadeOutAndNavigate(targetUrl, bgmId) {
            // 隱藏彈窗內容，讓畫面只剩黑屏背景
            document.querySelector(".modal-content").style.display = "none";

            const bgm = document.getElementById(bgmId);
            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                const fadeOut = setInterval(() => {
                    if (vol > 0.05) { 
                        vol -= 0.05; 
                        bgm.volume = vol; 
                    } else { 
                        clearInterval(fadeOut); 
                        bgm.pause(); 
                        window.location.href = targetUrl; 
                    }
                }, 100); 
            } else {
                window.location.href = targetUrl;
            }
        }
    </script>
</body>
</html>
