/* ==========================================

const sleep = ms => new Promise(
    resolve => setTimeout(resolve, ms)
);

const prefersReducedMotion =
    window.matchMedia(

/* ==========================================
   音樂淡入

   避免被瀏覽器阻擋時，
   音量計時器仍繼續執行。
========================================== */

let audioFadeToken = 0;

async function fadeAudioIn(
    audio,
    targetVolume = 0.5,
    duration = 5000
) {
    if (!audio) return;

    audio.volume = 0;

    try {
        await audio.play();
    } catch (error) {
        console.log(
            "BGM autoplay blocked:",
            error
        );
        return;
    }

    const token = ++audioFadeToken;
    const steps = 25;

    for (let i = 1; i <= steps; i++) {

        if (token !== audioFadeToken) {
            return;
        }

        audio.volume = Math.min(
            1,
            targetVolume * i / steps
        );

        await sleep(duration / steps);
    }
}

/* ==========================================
   音樂淡出
========================================== */

async function fadeAudioOut(
    audio,
    duration = 2000
) {
    audioFadeToken++;

    if (!audio || audio.paused) return;

    const startVolume = audio.volume;
    const steps = 25;

    for (let i = 1; i <= steps; i++) {

        audio.volume = Math.max(
            0,
            startVolume * (1 - i / steps)
        );

        await sleep(duration / steps);
    }

    audio.pause();
}

/* ==========================================
   打字機

   保留 <br> 換行效果，
   其他文字以 textContent 安全輸出。
========================================== */

async function typeLine(element, source) {

    const parts = source.split("<br>");

    const cursor = document.createElement("span");
    cursor.className = "cursor";

    element.appendChild(cursor);

    for (let p = 0; p < parts.length; p++) {

        if (p > 0) {
            element.insertBefore(
                document.createElement("br"),
                cursor
            );
        }

        for (const char of parts[p]) {

            element.insertBefore(
                document.createTextNode(char),
                cursor
            );

            let speed = prefersReducedMotion
                ? 0
                : 35 + Math.random() * 25;

            if ("，。！？".includes(char)) {
                speed += 180;
            }

            if (speed > 0) {
                await sleep(speed);
            }
        }
    }

    cursor.remove();
}

/* ==========================================
   訊息播放

   使用捲動動畫，
   並保留使用者向上閱讀的能力。
========================================== */

function appendMessage(container, data) {

    const shouldAutoScroll =
        container.scrollHeight
        - container.scrollTop
        - container.clientHeight < 100;

    const msg = document.createElement("div");

    msg.className =
        `msg msg-${data.sender}`;

    msg.textContent = data.text;

    container.appendChild(msg);

    if (shouldAutoScroll) {
        requestAnimationFrame(() => {

            container.scrollTo({
                top: container.scrollHeight,
                behavior: prefersReducedMotion
                    ? "instant"
                    : "smooth"
            });

        });
    }
}

    const chatContent = document.getElementById(
        "chat-content"
    );

    const logoutBtn = document.getElementById(
        "logout-btn"
    );

    /* 音樂淡入，與敘事同時執行 */

    fadeAudioIn(bgm);

    /* ==================================
       PHASE 1：終端備份
    ================================== */

    stage1.classList.add("active");

    await sleep(1000);

    for (let i = 0; i < narrativeLines.length; i++) {

        const div = document.createElement("div");
        div.className = "type-line";

        terminal.appendChild(div);

        await typeLine(
            div,
            narrativeLines[i]
        );

        /* 第一行完成後啟動進度條 */

        if (i === 0) {

            progressContainer.style.display = "block";
            progressLabel.style.display = "block";

            await sleep(100);

            progressBar.style.width = "100%";

            const progressStart = performance.now();

            const progressTimer = setInterval(() => {

                const elapsed =
                    performance.now() - progressStart;

                const percentage = Math.min(
                    100,
                    Math.floor(elapsed / 6000 * 100)
                );

                progressLabel.textContent =
                    `[ MEMORY ARCHIVE // ${percentage}% ]`;

                if (percentage >= 100) {
                    clearInterval(progressTimer);
                }

            }, 100);

        }

        await sleep(800);
    }

    /* 確保最後顯示 100% */

    progressBar.style.width = "100%";

    progressLabel.textContent =
        "[ MEMORY ARCHIVE // 100% ]";

    await sleep(1300);

    const completeLine = document.createElement("div");

    completeLine.className = "type-line";

    completeLine.style.color = "#b9decf";

    completeLine.textContent =
        "> 意識備份完成。虛擬沙盒啟動成功。";

    terminal.appendChild(completeLine);

    await sleep(2800);

    stage1.classList.remove("active");

    await sleep(2600);

    /* ==================================
       PHASE 2：沙盒對話
    ================================== */

    stage2.classList.add("active");

    await sleep(1800);

    for (const data of chatSequence) {

        await sleep(data.delayBefore);

        /* 談到營火，色調逐漸變暖 */

        if (data.warm) {
            document.body.classList.add(
                "memory-warming"
            );
        }

        appendMessage(
            chatContent,
            data
        );
    }

    /* 最後沉默停留 */

    await sleep(4500);

    /* 對話框淡出 */

    stage2.classList.remove("active");

    await sleep(2800);

    /* ==================================
       特殊演出：歡迎回來
    ================================== */

    await playReunion();

    /* ==================================
       PHASE 3：最終結局
    ================================== */

    stage3.classList.add("active");

    /* 先讓結語停留，再出現按鈕 */

    await sleep(5000);

    logoutBtn.classList.add("visible");
}

/* ==========================================
   LOGOUT：淡出音樂與畫面
========================================== */

let navigating = false;

async function fadeOutAndNavigate(
    event,
    targetUrl = "index.html"
) {

    if (event) {
        event.preventDefault();
    }

    if (navigating) return;
    navigating = true;

    const stage3 = document.getElementById(
        "stage-3"
    );

    const logoutBtn = document.getElementById(
        "logout-btn"
    );

    const bgm = document.getElementById(
        "end-bgm"
    );

    logoutBtn.style.pointerEvents = "none";

    stage3.classList.remove("active");

    await fadeAudioOut(bgm, 2200);

    window.location.href = targetUrl;
}

/* ==========================================
   初始化
========================================== */

window.addEventListener(
    "load",
    playNarrative
);

document.getElementById(
    "logout-btn"
).addEventListener(
    "click",
    event => {
        fadeOutAndNavigate(
            event,
            "index.html"
        );
    }
);

</script>
